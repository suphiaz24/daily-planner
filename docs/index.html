<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1 id="title">Today</h1>
      <button id="logout" type="button" class="link" hidden>Forget password</button>
    </header>

    <form id="login" hidden>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Save</button>
    </form>

    <section id="app" hidden>
      <div class="toolbar">
        <div id="views" class="group" role="group" aria-label="View">
          <button type="button" data-days="1">Day</button>
          <button type="button" data-days="3">3 days</button>
          <button type="button" data-days="7">Week</button>
        </div>
        <div class="group">
          <button id="prev" type="button" aria-label="Previous">‹</button>
          <button id="today" type="button">Today</button>
          <button id="next" type="button" aria-label="Next">›</button>
          <input id="date" type="date" aria-label="Go to date" required>
        </div>
      </div>

      <p id="status" role="status"></p>

      <div class="grid-wrap">
        <div id="grid" class="grid"></div>
      </div>

      <div id="day-lists">
        <h2>Free time</h2>
        <ul id="blocks"></ul>

        <h2>Busy</h2>
        <ul id="busy"></ul>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
